version: "2"
sql:
  - schema: "db/migration/000001_init.up.sql"
    queries: "db/query"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "db"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
