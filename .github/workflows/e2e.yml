name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # PostgreSQL is the primary (cloud) backend, so the full Playwright suite
    # runs against it. SQLite is covered by a dedicated, focused spec instead of
    # a second full run — see the "SQLite backend E2E" step. The server picks its
    # backend from DATABASE_URL (see main.go).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.4'

    - name: Set up Atlas
      uses: ariga/setup-atlas@v0

    - name: Apply PostgreSQL migrations
      uses: ariga/atlas-action/migrate/apply@v1
      with:
        dir: file://db/migrations/postgres?format=golang-migrate
        url: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable
        revisions-schema: public

    # Fetches Go module dependencies as early as possible (independent of the
    # frontend build below), so the "Build Go server" step further down is
    # mostly just compilation.
    - name: Download Go module dependencies
      run: go mod download

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # Fast dialect-specific signal before the browser suite: the Go integration
    # tests (migration compatibility, raw-SQL query surface, backup/restore sequence
    # realignment) run only when TEST_POSTGRES_URL is set. -p 1 serializes the
    # two packages: they share one Postgres database and each DROP SCHEMAs +
    # AutoMigrates it, so running them concurrently races on type creation.
    - name: Run Go Postgres integration tests
      run: go test ./db/ ./pkg/backup/ -run TestPostgres -p 1 -v
      env:
        TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable

    - name: Install Frontend Dependencies
      timeout-minutes: 5
      run: |
        cd frontend
        npm ci

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    # Compiles the server ahead of the Playwright run (after the frontend
    # build, since main.go embeds frontend/dist) so module download + build —
    # which can take longer than the e2e harness's 60s server-ready timeout on
    # a cold module cache — happen here, where a real failure is a clear build
    # error instead of a "server never became reachable" timeout.
    - name: Build Go server
      run: go build -o agent-orchestrator .

    - name: Install E2E Dependencies
      timeout-minutes: 5
      run: |
        cd e2e
        npm ci

    - name: Install Playwright Browsers
      run: |
        cd e2e
        npx playwright install --with-deps chromium

    # Primary: the whole suite against PostgreSQL. SQLite-only specs
    # (sqlite_backend) self-skip here.
    - name: Run Playwright tests (PostgreSQL — primary)
      timeout-minutes: 15
      run: |
        cd e2e
        npx playwright test
      env:
        E2E_MODE: true
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable

    - name: Upload PostgreSQL report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-postgres
        path: e2e/playwright-report/
        retention-days: 30

    # Dedicated SQLite coverage: the on-disk layout, WAL journaling, and
    # autoincrement-reset edge cases that only apply with no DATABASE_URL. Runs
    # even if the Postgres run failed, so both backends give an independent
    # signal.
    - name: Run SQLite backend E2E
      if: always()
      timeout-minutes: 12
      run: |
        cd e2e
        npx playwright test sqlite_backend auto_update_resume deploy_webhook shared_db
      env:
        E2E_MODE: true

    - name: Upload SQLite report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-sqlite
        path: e2e/playwright-report/
        retention-days: 30
