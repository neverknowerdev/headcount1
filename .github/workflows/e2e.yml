name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    # Fetches Go module dependencies as early as possible (independent of the
    # frontend build below), so the "Build Go server" step further down is
    # mostly just compilation.
    - name: Download Go module dependencies
      run: go mod download

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    # Compiles the server ahead of the Playwright run (after the frontend
    # build, since main.go embeds frontend/dist) so module download + build —
    # which can take longer than the e2e harness's 60s server-ready timeout on
    # a cold module cache — happen here, where a real failure is a clear build
    # error instead of a "server never became reachable" timeout.
    - name: Build Go server
      run: go build -o agent-orchestrator .

    - name: Install E2E Dependencies
      run: |
        cd e2e
        npm install
        
    - name: Install Playwright Browsers
      run: |
        cd e2e
        npx playwright install --with-deps chromium
        
    - name: Run Playwright tests
      run: |
        cd e2e
        npx playwright test
      env:
        E2E_MODE: true
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 30
