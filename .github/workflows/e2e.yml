name: E2E Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    # PostgreSQL is the primary (cloud) backend, so the full Playwright suite
    # runs against it. SQLite is covered by a dedicated, focused spec instead of
    # a second full run — see the "SQLite backend E2E" step. The server picks its
    # backend from DATABASE_URL (see main.go).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.4'

    # Fetches Go module dependencies as early as possible (independent of the
    # frontend build below), so the "Build Go server" step further down is
    # mostly just compilation.
    - name: Download Go module dependencies
      run: go mod download

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      timeout-minutes: 5
      run: |
        cd frontend
        # npm install is intentional here: npm ci can omit platform-specific
        # optional Vite/Rolldown bindings when the lockfile was produced on a
        # different OS (npm/cli#4828), leaving Linux runners unable to build.
        npm install

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    # Compiles the same server artifact that the production-style E2E harness
    # starts below. This also ensures the embedded migration directory is part
    # of the binary being exercised by the migration probe.
    - name: Build Go server
      run: go build -o agent-orchestrator .

    # Exercise the exact startup path used in production: the built binary
    # opens PostgreSQL and applies its embedded migrations before it starts
    # serving HTTP. The migration and repository integration suites run in the
    # separate Go Tests workflow; this probe keeps the browser workflow focused
    # on the production binary handoff and E2E behavior.
    - name: Exercise embedded migrations through production binary
      timeout-minutes: 5
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable
        E2E_MODE: true
        E2E_HEADCOUNT1_HOME: ${{ runner.temp }}/headcount1-migration-probe
        PORT: '18080'
      run: |
        set -euo pipefail
        rm -rf "$E2E_HEADCOUNT1_HOME"
        log_file="$RUNNER_TEMP/headcount1-migration-probe.log"
        ./agent-orchestrator >"$log_file" 2>&1 &
        pid=$!
        cleanup() {
          kill -TERM "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
        }
        trap cleanup EXIT

        ready=0
        for _ in $(seq 1 120); do
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log_file"
            echo "migration probe binary exited before readiness" >&2
            exit 1
          fi
          if curl --fail --silent http://127.0.0.1:18080/api/ping >/dev/null; then
            ready=1
            break
          fi
          sleep 0.25
        done
        if [ "$ready" -ne 1 ]; then
          cat "$log_file"
          echo "migration probe binary did not become ready" >&2
          exit 1
        fi

    - name: Install E2E Dependencies
      timeout-minutes: 5
      run: |
        cd e2e
        npm install

    - name: Install Playwright Browsers
      run: |
        cd e2e
        npx playwright install --with-deps chromium

    # globalSetup starts this same built binary against the database prepared
    # by the migration probe; its normal startup migration pass is therefore
    # the schema hand-off into the browser suite, just as it is during a
    # production restart.
    # Primary: the whole suite against PostgreSQL. SQLite-only specs
    # (sqlite_backend) self-skip here.
    - name: Run Playwright tests (PostgreSQL — primary)
      timeout-minutes: 15
      run: |
        cd e2e
        npx playwright test
      env:
        E2E_MODE: true
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable

    - name: Upload PostgreSQL report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-postgres
        path: e2e/playwright-report/
        retention-days: 30

    # Dedicated SQLite coverage: the on-disk layout, WAL journaling,
    # autoincrement-reset, lifecycle, and cross-process cases that only apply
    # with no DATABASE_URL. This runs after the shared dependency/build setup so
    # a failed prerequisite cannot produce a misleading second failure.
    - name: Run SQLite backend E2E
      timeout-minutes: 12
      run: |
        cd e2e
        npx playwright test sqlite_backend auto_update_resume deploy_webhook shared_db
      env:
        E2E_MODE: true

    - name: Run self-updater process E2E
      timeout-minutes: 5
      run: go test -tags=selfupdate_e2e ./test/selfupdate_e2e -count=1

    - name: Upload SQLite report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-sqlite
        path: e2e/playwright-report/
        retention-days: 30
