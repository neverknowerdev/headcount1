name: Go Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: go-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Download Go module dependencies
        run: go mod download

      - name: Run unit tests
        run: go test ./... -count=1

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Download Go module dependencies
        run: go mod download

      - name: Run embedded migration tests
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable
        run: go test ./db/migrations -run '^TestApply' -count=1 -v

      - name: Run PostgreSQL integration tests
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/orchestrator?sslmode=disable
        run: go test ./db/ ./pkg/backup/ -run '^TestPostgres' -p 1 -count=1 -v
