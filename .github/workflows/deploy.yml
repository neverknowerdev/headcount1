name: Deploy

# Server-side deploy pipeline. CI builds the Linux server binary, publishes it
# as a GitHub release asset, and notifies the target server's authenticated
# /api/deploy/webhook. The SERVER decides whether to apply the event (based on
# its HEADCOUNT1_ENV and its deploy_source/auto_deploy settings); CI just routes:
#
#   - push to main        -> PRODUCTION (event_type=main)
#   - published release   -> PRODUCTION (event_type=release)
#   - an open pull request -> STAGING    (event_type=branch)
#   - manual run          -> STAGING, on whichever branch you pick
#
# Every trigger is gated to the repository owner (see the `if:` on `decide`), so
# a collaborator or an outside contributor cannot cause a deploy.
#
# DEPLOYING A PR TO STAGING — ON REQUEST ONLY
# Nothing deploys to staging on its own. Pushing to a PR builds and tests it as
# usual but never touches staging. To deploy a PR, comment on it:
#
#     /deploy
#
# That builds the PR's head commit and sends it to staging. No label to add, and
# no deployment is queued (or left pending) unless you ask for one. The comment
# gets a rocket reaction as an ack; the deploy then shows up under the repo's
# Environments/Deployments UI.
#
# `workflow_dispatch` (Actions tab -> Run workflow -> pick a branch) does the
# same thing when you'd rather not go through a PR.
#
# The `deploy` job runs in a GitHub Environment — "production" for production
# and "Preview" for staging — so protection rules configured there (required
# reviewers, wait timer) apply on top of the explicit request, and each deploy
# is recorded with a link to the live URL.
#
# Required config, set ON EACH ENVIRONMENT (Settings -> Environments), so one
# name covers both stages and the workflow never branches on the target:
#   vars.DEPLOY_URL         - production: https://app.headcount1.ai
#                             Preview:    https://stagingapp.headcount1.ai
#   secrets.DEPLOY_API_KEY  - must equal that server's HEADCOUNT1_DEPLOY_API_KEY.
#                             Defining it per environment lets production and
#                             staging hold DIFFERENT keys, so a leaked staging
#                             key cannot deploy production. A single
#                             repository-level secret also works if you'd rather
#                             share one key.
# If the releases repo is private, each server also needs
# HEADCOUNT1_DEPLOY_DOWNLOAD_TOKEN set to a PAT that can read release assets.

on:
  push:
    branches: [main]
  # A "/deploy" comment on a pull request — the on-request staging deploy.
  # Deliberately NOT `pull_request`: that would queue a deployment on every
  # push, which is not a request.
  issue_comment:
    types: [created]
  release:
    types: [published]
  # No input: GitHub's own branch picker chooses what to deploy to staging.
  workflow_dispatch:

concurrency:
  # One in-flight deploy per PR (or per target ref); a newer request supersedes
  # an in-flight one for the same PR.
  group: deploy-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap routing job: works out whether this event deploys anywhere, and where.
  # Kept separate from the build so an ordinary branch push (the common case,
  # which deploys nothing) costs one tiny job instead of a full Go+Node setup.
  decide:
    runs-on: ubuntu-latest
    # Deploys are owner-only. github.actor is the identity that triggered this
    # run (pusher, release publisher, commenter, or dispatcher); anyone else
    # gets no job at all.
    # NOTE: if this repo ever moves to an organization, repository_owner becomes
    # the org name and will never equal a username — switch this to an explicit
    # actor allowlist or rely on Environment required-reviewers instead.
    #
    # For issue_comment the job only starts for a "/deploy" comment on a PULL
    # REQUEST, so ordinary discussion on issues and PRs never spins up a runner.
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request != null &&
         startsWith(github.event.comment.body, '/deploy')))
    permissions:
      contents: read
      pull-requests: read # resolve the PR's head commit for a /deploy comment
      issues: write # react to the /deploy comment so the request is acknowledged
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      env: ${{ steps.decide.outputs.env }}
      gh_env: ${{ steps.decide.outputs.gh_env }}
      event_type: ${{ steps.decide.outputs.event_type }}
      ref: ${{ steps.decide.outputs.ref }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
      commit: ${{ steps.decide.outputs.commit }}
      date: ${{ steps.decide.outputs.date }}
    steps:
      # Immediate feedback that the request was accepted: a run triggered by
      # issue_comment is attached to the default branch, not the PR, so it does
      # NOT appear in the PR's checks — without this the comment would look
      # ignored.
      - name: Acknowledge the /deploy request
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" \
            -f content=rocket --silent || true

      - name: Decide target
        id: decide
        # Event data is passed through the environment rather than interpolated
        # into the script: a branch or tag name is attacker-influenced text, and
        # `${{ }}` inside run: would splice it straight into the shell.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          deploy=false; env=""; event_type=""; ref=""; tag=""; sha=""

          case "$EVENT" in
            release)
              deploy=true; env=production; event_type=release
              ref="$RELEASE_TAG"; sha="$PUSH_SHA"
              # Upload into the existing release, so reuse its real tag.
              tag="$ref"
              ;;
            issue_comment)
              # Someone asked for this one explicitly with "/deploy" on a PR.
              # The comment carries no head info, so resolve the PR's current
              # head commit — the deployed build is exactly what the PR contains
              # at the moment the deploy was requested.
              deploy=true; env=staging; event_type=branch
              read -r ref sha < <(gh api "repos/$REPO/pulls/$PR_NUMBER" \
                --jq '"\(.head.ref) \(.head.sha)"')
              tag="deploy-staging-$(printf '%s' "$ref" | tr '/' '-')"
              ;;
            workflow_dispatch)
              deploy=true; env=staging; event_type=branch
              ref="$PUSH_REF"; sha="$PUSH_SHA"
              tag="deploy-staging-$(printf '%s' "$ref" | tr '/' '-')"
              ;;
            push)
              # Only main reaches here (see the push filter in `on:`).
              # Tag is NOT "main": a release tag named "main" would collide with
              # the branch ref and make `git checkout main` / `git describe`
              # ambiguous. All rolling deploy tags carry a deploy- prefix.
              deploy=true; env=production; event_type=main
              ref="$PUSH_REF"; sha="$PUSH_SHA"; tag=deploy-main
              ;;
          esac

          COMMIT="${sha:0:7}"

          # GitHub Environment name for this target. "production" is special-cased
          # by GitHub (it marks the deployment as a production deployment);
          # staging deploys are surfaced as "Preview".
          gh_env=""
          case "$env" in
            production) gh_env=production ;;
            staging)    gh_env=Preview ;;
          esac

          {
            echo "deploy=$deploy"
            echo "env=$env"
            echo "gh_env=$gh_env"
            echo "event_type=$event_type"
            echo "ref=$ref"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "commit=$COMMIT"
            echo "date=$DATE"
          } >> "$GITHUB_OUTPUT"
          echo "Decision: deploy=$deploy env=$env event_type=$event_type ref=$ref tag=$tag sha=$sha"

  deploy:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Binds the run to the target GitHub Environment ("production" / "Preview"),
    # so any protection rules (required reviewers, wait timer) configured there
    # apply to this deploy. url makes the deployment clickable in that UI.
    environment:
      name: ${{ needs.decide.outputs.gh_env }}
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: write # create/update release assets
    steps:
      # Check out the exact commit `decide` resolved. For a pull_request event
      # that is the PR's head commit, not the merge commit GitHub would check
      # out by default — the artifact we ship must be what the PR contains, and
      # the release tag must point at a commit that actually exists on a branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Build server binary (linux/amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.CommitHash=${{ needs.decide.outputs.commit }} -X main.BuildDate=${{ needs.decide.outputs.date }} -X main.Branch=${{ needs.decide.outputs.ref }}" \
            -o agent-orchestrator-linux-amd64 \
            main.go

      - name: Publish release asset
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.decide.outputs.tag }}"
          if [ "${{ github.event_name }}" = "release" ]; then
            # The release already exists — just attach/refresh the built binary.
            gh release upload "$TAG" agent-orchestrator-linux-amd64 --clobber
          else
            # Rolling prerelease per tag (deploy-main / deploy-staging-<branch>):
            # recreate so the asset always reflects the latest push.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" \
              --prerelease \
              --target "${{ needs.decide.outputs.sha }}" \
              --title "deploy $TAG @ ${{ needs.decide.outputs.commit }}" \
              --notes "Automated deploy build for ${{ needs.decide.outputs.ref }} (${{ needs.decide.outputs.commit }})." \
              agent-orchestrator-linux-amd64
          fi
          # The server pins the artifact by digest, so publish the digest of the
          # exact bytes we just uploaded.
          SHA256=$(sha256sum agent-orchestrator-linux-amd64 | awk '{print $1}')
          # Use the asset API URL (not browser_download_url): it serves the raw
          # binary with Accept: application/octet-stream and works with a bearer
          # token, so it also covers a private releases repo.
          ASSET_URL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="agent-orchestrator-linux-amd64") | .url')
          test -n "$ASSET_URL"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Notify server
        env:
          # Both resolve per-environment: this job runs in the "production" or
          # "Preview" Environment, and variables/secrets defined there override
          # the repository-level ones of the same name. So there is one name for
          # each, and no branching on the target here.
          BASE: ${{ vars.DEPLOY_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            echo "No DEPLOY_URL variable set on the '${{ needs.decide.outputs.gh_env }}' environment."
            exit 1
          fi
          payload=$(jq -nc \
            --arg et "${{ needs.decide.outputs.event_type }}" \
            --arg ref "${{ needs.decide.outputs.ref }}" \
            --arg commit "${{ needs.decide.outputs.commit }}" \
            --arg date "${{ needs.decide.outputs.date }}" \
            --arg url "${{ steps.publish.outputs.asset_url }}" \
            --arg sha "${{ steps.publish.outputs.sha256 }}" \
            --arg target "${{ needs.decide.outputs.env }}" \
            '{event_type:$et, ref:$ref, commit:$commit, build_date:$date, download_url:$url, sha256:$sha, target:$target}')
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$BASE/api/deploy/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Key: $DEPLOY_KEY" \
            -d "$payload")
          echo "Server responded HTTP $code:"; cat /tmp/resp || true; echo
          # 202 = deploying, 200 = accepted-but-ignored (wrong env/source, or
          # already current). Both are successful outcomes for CI.
          case "$code" in
            200|202) echo "notify ok" ;;
            *) echo "deploy notify failed"; exit 1 ;;
          esac
