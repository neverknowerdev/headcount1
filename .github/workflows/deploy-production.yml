name: Deploy Production

# Production deploys. Triggered by landing code on main or publishing a
# release — never from a pull request, which can only reach staging (see
# deploy-staging.yml).
#
#   push to main       -> event_type=main
#   published release  -> event_type=release
#
# Both get a CalVer version from scripts/version.sh (2026.07.29, then .1/.2 for
# further builds the same day) — a release's own tag names the release, it does
# not name the build. Every production build tags the commit it was built from
# with its version, which both reserves the number and makes the version the app
# reports point at an artifact that can be re-deployed.
#
# The SERVER decides whether to apply the event: a production server tracks
# either releases (default) or main, per its deploy_source setting, and
# acknowledges the other with "200 ignored". So both triggers can stay on
# without double-deploying.
#
# Deploys are owner-only. The job runs in the "production" GitHub Environment —
# GitHub special-cases that name as a production deployment — so required
# reviewers or a wait timer configured there gate the deploy, and it is recorded
# with a link to the live URL.
#
# Config lives ON THE ENVIRONMENT (Settings -> Environments -> production):
#   vars.DEPLOY_URL        - https://app.headcount1.ai
#   secrets.DEPLOY_API_KEY - must equal that server's HEADCOUNT1_DEPLOY_API_KEY
#   vars.DEPLOY_ENV_KEYS   - which of this environment's OTHER vars/secrets to
#                            deliver to the server as its env vars, one name per
#                            line (see .github/actions/collect-deploy-env). This
#                            is how the app's own configuration and secrets are
#                            managed in GitHub instead of on the box.

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  # Never cancel a production deploy that is already shipping; queue instead.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # NOTE: if this repo moves to an organization, repository_owner becomes the
    # org name and will never equal a username; switch to an actor allowlist or
    # rely on the production environment's required reviewers instead.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: write # tag the build and publish its release asset
    steps:
      - name: Resolve what to deploy
        id: target
        env:
          EVENT: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then
            event_type=release
            ref="$RELEASE_TAG"
          else
            event_type=main
            ref="$PUSH_REF"
          fi
          {
            echo "event_type=$event_type"
            echo "ref=$ref"
            echo "release_tag=$RELEASE_TAG"
            echo "commit=${SHA:0:7}"
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $ref @ ${SHA:0:7} to production ($event_type)"

      - uses: actions/checkout@v4
        with:
          # Tags + full history: scripts/version.sh picks the next free CalVer by
          # probing existing tags, which a shallow clone cannot see.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Configuration the server should run with, taken from this environment's
      # variables and secrets. Collected before the build so a misconfigured
      # DEPLOY_ENV_KEYS fails the job in seconds rather than after a full build.
      - name: Collect delivered env
        id: env
        uses: ./.github/actions/collect-deploy-env
        with:
          keys: ${{ vars.DEPLOY_ENV_KEYS }}
          secrets_json: ${{ toJSON(secrets) }}
          vars_json: ${{ toJSON(vars) }}

      - name: Build
        id: build
        run: |
          set -euo pipefail
          # Versions are always minted here, for every trigger — never taken from
          # whatever tag a release happens to carry. One scheme, so "2026.07.29"
          # means the same thing however the deploy was started.
          VERSION=$(./scripts/version.sh production)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"
          cd frontend && npm install && npm run build && cd ..
          GOOS=linux GOARCH=amd64 go build \
            -ldflags "-X main.Version=$VERSION -X main.CommitHash=${{ steps.target.outputs.commit }} -X main.BuildDate=${{ steps.target.outputs.date }} -X main.Branch=${{ steps.target.outputs.ref }}" \
            -o agent-orchestrator-linux-amd64 \
            main.go

      - name: Publish release asset
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            # Reserve the version by tagging the commit it was built from.
            # version.sh mints the next number by reading these tags, so without
            # this a second release the same day would be handed the same one.
            git tag "$VERSION" "$SHA"
            git push origin "refs/tags/$VERSION"
            # The release itself already exists under the tag a human chose —
            # attach the binary there rather than opening a competing release.
            gh release upload "$RELEASE_TAG" agent-orchestrator-linux-amd64 --clobber
            asset_tag="$RELEASE_TAG"
          else
            # One release per production build, tagged with its version (which
            # also reserves the number). Not rolling: every build stays
            # downloadable, so a bad deploy can be rolled back to the exact bytes
            # of the previous one.
            # Marked prerelease so "latest release" keeps meaning a release a
            # human published, which is what the releases deploy_source tracks.
            gh release create "$VERSION" \
              --prerelease \
              --target "$SHA" \
              --title "$VERSION (main @ ${{ steps.target.outputs.commit }})" \
              --notes "Production deploy build for main (${{ steps.target.outputs.commit }})." \
              agent-orchestrator-linux-amd64
            asset_tag="$VERSION"
          fi
          # The server pins the artifact by digest, so publish the digest of the
          # exact bytes we uploaded. The asset API URL (not browser_download_url)
          # serves the raw binary with a bearer token, covering a private repo.
          {
            echo "sha256=$(sha256sum agent-orchestrator-linux-amd64 | awk '{print $1}')"
            echo "asset_url=$(gh api "repos/${{ github.repository }}/releases/tags/$asset_tag" \
              --jq '.assets[] | select(.name=="agent-orchestrator-linux-amd64") | .url')"
          } >> "$GITHUB_OUTPUT"

      - name: Notify production server
        env:
          BASE: ${{ vars.DEPLOY_URL }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_API_KEY }}
          ENV_FILE: ${{ steps.env.outputs.env_file }}
          ENV_SECRET_KEYS: ${{ steps.env.outputs.secret_keys_json }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            echo "No DEPLOY_URL variable set on the 'production' environment."
            exit 1
          fi
          # The payload carries the delivered configuration, so it goes through a
          # 0600 file rather than an argv/variable: `curl -d "$payload"` would put
          # secrets in this runner's process list.
          payload_file="$RUNNER_TEMP/deploy-payload.json"
          umask 077
          jq -n \
            --arg et "${{ steps.target.outputs.event_type }}" \
            --arg ref "${{ steps.target.outputs.ref }}" \
            --arg commit "${{ steps.target.outputs.commit }}" \
            --arg date "${{ steps.target.outputs.date }}" \
            --arg url "${{ steps.publish.outputs.asset_url }}" \
            --arg sha "${{ steps.publish.outputs.sha256 }}" \
            --arg version "${{ steps.build.outputs.version }}" \
            --slurpfile env "$ENV_FILE" \
            --argjson skeys "$ENV_SECRET_KEYS" \
            '{event_type:$et, ref:$ref, commit:$commit, build_date:$date,
              version:$version, download_url:$url, sha256:$sha, target:"production",
              env:$env[0], env_secret_keys:$skeys}' > "$payload_file"
          echo "Delivering env: ${{ steps.env.outputs.summary }}"
          code=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST "$BASE/api/deploy/webhook" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Key: $DEPLOY_KEY" \
            --data-binary "@$payload_file")
          rm -f "$payload_file" "$ENV_FILE"
          echo "Server responded HTTP $code:"; cat /tmp/resp || true; echo
          # 202 = deploying (or restarting to pick up changed config), 200 =
          # accepted-but-ignored (this server tracks the other source,
          # auto_deploy paused, or already running this commit with this config).
          case "$code" in
            200|202) echo "notify ok" ;;
            *) echo "deploy notify failed"; exit 1 ;;
          esac
